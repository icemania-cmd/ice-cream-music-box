<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>🎵 LRC タイミングツール — Scoop Me Up</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a14;
    color: #ddd;
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px 16px;
  }
  h1 { color: #D65076; font-size: 18px; margin-bottom: 6px; }
  .subtitle { color: #555; font-size: 12px; margin-bottom: 20px; }

  #player {
    background: #12060e;
    border: 1px solid rgba(214,80,118,0.2);
    border-radius: 12px;
    padding: 16px 20px;
    width: 100%;
    max-width: 520px;
    margin-bottom: 16px;
  }
  audio { width: 100%; margin-bottom: 12px; }
  .timer {
    text-align: center;
    font-size: 36px;
    font-weight: 700;
    color: #D65076;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }

  #status {
    text-align: center;
    font-size: 13px;
    color: #666;
    margin-bottom: 16px;
    min-height: 20px;
  }

  #tap-btn {
    display: block;
    width: 100%;
    max-width: 520px;
    padding: 18px;
    background: linear-gradient(135deg, #D65076, #c04068);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(214,80,118,0.4);
    transition: transform 0.1s, box-shadow 0.1s;
    letter-spacing: 0.05em;
  }
  #tap-btn:active { transform: scale(0.97); box-shadow: 0 2px 10px rgba(214,80,118,0.3); }
  #tap-btn:disabled { background: #333; box-shadow: none; color: #666; cursor: not-allowed; }

  .hint { color: #444; font-size: 11px; text-align: center; margin-bottom: 20px; }

  #lyrics-list {
    width: 100%;
    max-width: 520px;
    background: #12060e;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .lyric-row {
    display: flex;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    transition: background 0.2s;
    gap: 12px;
  }
  .lyric-row:last-child { border-bottom: none; }
  .lyric-row.active {
    background: rgba(214,80,118,0.15);
  }
  .lyric-row.done {
    opacity: 0.5;
  }
  .lyric-time {
    font-size: 11px;
    color: #D65076;
    min-width: 52px;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }
  .lyric-text {
    font-size: 13px;
    color: #ccc;
    flex: 1;
    line-height: 1.5;
  }
  .lyric-row.active .lyric-text { color: #fff; font-weight: 700; }

  #output-area {
    display: none;
    width: 100%;
    max-width: 520px;
  }
  #output-area h2 { color: #D65076; font-size: 15px; margin-bottom: 10px; }
  #lrc-output {
    width: 100%;
    background: #0f0f1a;
    border: 1px solid rgba(214,80,118,0.3);
    border-radius: 8px;
    color: #adf;
    font-family: monospace;
    font-size: 12px;
    padding: 12px;
    height: 200px;
    resize: vertical;
    margin-bottom: 12px;
  }
  .output-btns { display: flex; gap: 10px; }
  .btn-secondary {
    flex: 1;
    padding: 12px;
    background: rgba(214,80,118,0.15);
    border: 1px solid rgba(214,80,118,0.4);
    border-radius: 8px;
    color: #D65076;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-secondary:hover { background: rgba(214,80,118,0.25); }

  .progress-bar-wrap {
    width: 100%;
    max-width: 520px;
    background: #222;
    border-radius: 4px;
    height: 4px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #D65076, #ff80a0);
    transition: width 0.3s linear;
    width: 0%;
  }
</style>
</head>
<body>

<h1>🎵 LRC タイミングツール</h1>
<p class="subtitle">Scoop Me Up — 曲に合わせて各行の頭でタップ</p>

<div id="player">
  <audio id="audio" src="http://localhost:3000/api/audio/Scoop%20Me%20Up.mp3" controls preload="auto"></audio>
  <div class="timer" id="timer">0:00.00</div>
</div>

<div id="status">▶ 曲を再生してから、各行の歌い始めにボタンを押してください</div>

<button id="tap-btn" onclick="tap()">
  ⬇ タップ（スペースキーでも可）
</button>
<p class="hint">残り <span id="remaining">45</span> 行</p>

<div class="progress-bar-wrap">
  <div class="progress-bar-fill" id="progress-fill"></div>
</div>

<div id="lyrics-list"></div>

<div id="output-area">
  <h2>✅ 完成！LRCをコピーしてファイルに保存してください</h2>
  <textarea id="lrc-output" readonly></textarea>
  <div class="output-btns">
    <button class="btn-secondary" onclick="copyLrc()">📋 コピー</button>
    <button class="btn-secondary" onclick="downloadLrc()">⬇ ダウンロード</button>
    <button class="btn-secondary" onclick="resetAll()">🔄 やり直し</button>
  </div>
</div>

<script>
const LYRICS = [
  "溢れるフレーバー 選べないほど並んで",
  "本当の解答 見つけたかった",
  "簡単にわからない 味の奥深さ",
  "まるであなたの 本音みたい",
  "どうせ誘うのだったら 溶ける前",
  "Scoop me up before I melt",
  "言われるがまま 惰性の人生",
  "Just drifting through — is that your life?",
  "君もアイスも溶けるだけ 嗚呼 情けない",
  "Melting down, so pitiful",
  "まるごと捨てて 次に期待",
  "期間限定 そんなもの要らない",
  "出会いの数はそれなりに",
  "ただ寂しかっただけ",
  "貴方はそこにいただけ",
  "曖昧だけど 真っ当な理由",
  "冷たいままでいたい 温もり拒んで",
  "Stay frozen, stay alone",
  "選ばれるのを待ち 何も変わらない",
  "No choice made, no life shown",
  "フレーバーは無限なのに 縛られて",
  "Stuck in one, never whole",
  "固まったまま 冷凍庫で眠れ",
  "新作が出るとか出ないとか",
  "作られたファッションみたいね",
  "インスタントに使い捨てられるのに",
  "崇められてる ニューフェイス",
  "溶けることを恐れ 純粋を守る",
  "Keep it pure, or let it blend",
  "トッピングで 味を誤魔化して",
  "Covered up — what's genuine?",
  "シンプルなバニラ これで決まり",
  "Simple truths can transcend",
  "混ざるだけで 新しい味",
  "限定モノのオンパレード",
  "仕組まれた Nostalgia World",
  "息切れしながら それでも走る",
  "何故か心地よい Algorithm",
  "溶けぬように温度に媚び しがみつき",
  "Stay solid, stay safe",
  "誰かの\"好き\"になれど 二度とは会えないの",
  "Sweet words, but hollow taste",
  "賞味期限はないのに 怯えている",
  "Time runs, standing still",
  "ひとときの夢 一瞬の Story",
  "どうせ誘うのだったら 溶ける前",
  "Scoop me up before I melt",
  "惰性でこなす 退屈な人生",
  "Just drifting through — is that your life?",
  "君もアイスも溶けるだけ 嗚呼 情けない",
  "Melting down, so pitiful",
  "諦めることも ひとつの前進",
];

const audio = document.getElementById('audio');
const timerEl = document.getElementById('timer');
const statusEl = document.getElementById('status');
const tapBtn = document.getElementById('tap-btn');
const remainingEl = document.getElementById('remaining');
const progressFill = document.getElementById('progress-fill');
const listEl = document.getElementById('lyrics-list');
const outputArea = document.getElementById('output-area');

let timings = [];
let currentIdx = 0;
let rafId = null;

function fmtTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  const cs = Math.floor((sec % 1) * 100);
  return `${m}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
}

function fmtLrc(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  const cs = Math.floor((sec % 1) * 100);
  return `[${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}]`;
}

// タイマー更新
function updateTimer() {
  timerEl.textContent = fmtTime(audio.currentTime);
  rafId = requestAnimationFrame(updateTimer);
}
audio.addEventListener('play', () => {
  rafId = rafId || requestAnimationFrame(updateTimer);
  tapBtn.disabled = false;
  statusEl.textContent = currentIdx === 0
    ? '▶ 再生中 — 最初の行の歌い始めでタップ！'
    : `▶ 再生中 — ${currentIdx + 1}行目の頭でタップ`;
});
audio.addEventListener('pause', () => {
  cancelAnimationFrame(rafId);
  rafId = null;
});

// 歌詞リスト構築
function buildList() {
  listEl.innerHTML = '';
  LYRICS.forEach((text, i) => {
    const row = document.createElement('div');
    row.className = 'lyric-row' + (i === currentIdx ? ' active' : '') + (i < currentIdx ? ' done' : '');
    row.id = `row-${i}`;
    const timeEl = document.createElement('span');
    timeEl.className = 'lyric-time';
    timeEl.id = `time-${i}`;
    timeEl.textContent = timings[i] != null ? fmtLrc(timings[i]).slice(1,-1) : '--:--.--';
    const textEl = document.createElement('span');
    textEl.className = 'lyric-text';
    textEl.textContent = text;
    row.appendChild(timeEl);
    row.appendChild(textEl);
    listEl.appendChild(row);
  });
}
buildList();

function tap() {
  if (currentIdx >= LYRICS.length) return;
  if (!audio.paused === false) return; // 再生中のみ

  const t = audio.currentTime;
  timings[currentIdx] = t;

  // UI更新
  const prevRow = document.getElementById(`row-${currentIdx}`);
  if (prevRow) {
    prevRow.classList.remove('active');
    prevRow.classList.add('done');
  }
  document.getElementById(`time-${currentIdx}`).textContent = fmtLrc(t).slice(1,-1);

  currentIdx++;

  const progress = currentIdx / LYRICS.length;
  progressFill.style.width = `${progress * 100}%`;
  remainingEl.textContent = LYRICS.length - currentIdx;

  if (currentIdx < LYRICS.length) {
    const nextRow = document.getElementById(`row-${currentIdx}`);
    if (nextRow) {
      nextRow.classList.add('active');
      nextRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    statusEl.textContent = `▶ ${currentIdx + 1} / ${LYRICS.length} 行目 — 次の行の頭でタップ`;
  } else {
    // 完了
    finish();
  }
}

function finish() {
  tapBtn.disabled = true;
  statusEl.textContent = '✅ 全行完了！下のLRCをコピーしてファイルに保存してください';
  audio.pause();

  const lrc = LYRICS.map((text, i) => `${fmtLrc(timings[i] ?? 0)}${text}`).join('\n');
  document.getElementById('lrc-output').value = lrc;
  outputArea.style.display = 'block';
  outputArea.scrollIntoView({ behavior: 'smooth' });
}

function copyLrc() {
  const ta = document.getElementById('lrc-output');
  ta.select();
  document.execCommand('copy');
  alert('コピーしました！');
}

function downloadLrc() {
  const content = document.getElementById('lrc-output').value;
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Scoop Me Up.lrc';
  a.click();
}

function resetAll() {
  timings = [];
  currentIdx = 0;
  tapBtn.disabled = false;
  outputArea.style.display = 'none';
  progressFill.style.width = '0%';
  remainingEl.textContent = LYRICS.length;
  statusEl.textContent = '▶ 曲を再生してから、各行の歌い始めにボタンを押してください';
  buildList();
  audio.currentTime = 0;
}

// スペースキーでタップ（audioのデフォルト再生停止を上書き）
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target !== audio) {
    e.preventDefault();
    if (!audio.paused) tap();
  }
});
</script>
</body>
</html>
