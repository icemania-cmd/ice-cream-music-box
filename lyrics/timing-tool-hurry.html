<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>🎵 LRC タイミングツール — Hurry! Hurry! Hurry!</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a14;
    color: #ddd;
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', sans-serif;
    padding-bottom: 160px; /* fixed footer の高さ分 */
  }

  /* ── スクロールエリア ── */
  .scroll-area {
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 16px 0;
  }
  h1 { color: #D65076; font-size: 18px; margin-bottom: 4px; }
  .subtitle { color: #555; font-size: 12px; margin-bottom: 16px; }

  #player {
    background: #12060e;
    border: 1px solid rgba(214,80,118,0.2);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  audio { width: 100%; margin-bottom: 8px; }
  .timer {
    text-align: center;
    font-size: 32px;
    font-weight: 700;
    color: #D65076;
    font-variant-numeric: tabular-nums;
  }

  .progress-bar-wrap {
    background: #222; border-radius: 4px; height: 4px;
    margin-bottom: 12px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #D65076, #ff80a0);
    transition: width 0.3s linear; width: 0%;
  }

  #lyrics-list {
    background: #12060e;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .lyric-row {
    display: flex; align-items: center;
    padding: 11px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    gap: 12px; transition: background 0.15s;
  }
  .lyric-row:last-child { border-bottom: none; }
  .lyric-row.active { background: rgba(214,80,118,0.18); }
  .lyric-row.done { opacity: 0.45; }
  .lyric-time {
    font-size: 11px; color: #D65076;
    min-width: 54px; font-variant-numeric: tabular-nums; font-weight: 700;
  }
  .lyric-text { font-size: 13px; color: #ccc; flex: 1; line-height: 1.5; }
  .lyric-row.active .lyric-text { color: #fff; font-weight: 700; }

  #output-area { display: none; margin-bottom: 20px; }
  #output-area h2 { color: #D65076; font-size: 15px; margin-bottom: 10px; }
  #lrc-output {
    width: 100%; background: #0f0f1a;
    border: 1px solid rgba(214,80,118,0.3); border-radius: 8px;
    color: #adf; font-family: monospace; font-size: 12px;
    padding: 12px; height: 260px; resize: vertical; margin-bottom: 12px;
  }
  .output-btns { display: flex; gap: 10px; }
  .btn-secondary {
    flex: 1; padding: 12px;
    background: rgba(214,80,118,0.15);
    border: 1px solid rgba(214,80,118,0.4);
    border-radius: 8px; color: #D65076; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .btn-secondary:hover { background: rgba(214,80,118,0.25); }

  /* ── 固定フッター ── */
  #fixed-footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(10,10,20,0.96);
    backdrop-filter: blur(12px);
    border-top: 1px solid rgba(214,80,118,0.2);
    padding: 12px 16px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 100;
  }
  #next-line {
    font-size: 13px;
    color: #D65076;
    font-weight: 700;
    text-align: center;
    min-height: 20px;
    letter-spacing: 0.02em;
  }
  #status {
    font-size: 11px;
    color: #555;
    text-align: center;
    min-height: 16px;
  }
  .footer-btns {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 520px;
  }
  #tap-btn {
    flex: 1;
    padding: 16px;
    background: linear-gradient(135deg, #D65076, #c04068);
    border: none; border-radius: 12px;
    color: #fff; font-size: 17px; font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(214,80,118,0.4);
    transition: transform 0.08s, box-shadow 0.08s;
    letter-spacing: 0.05em;
  }
  #tap-btn:active { transform: scale(0.97); box-shadow: 0 2px 10px rgba(214,80,118,0.3); }
  #tap-btn:disabled { background: #2a2a3a; box-shadow: none; color: #444; cursor: not-allowed; }
  #undo-btn {
    padding: 16px 18px;
    background: transparent;
    border: 1px solid #333; border-radius: 12px;
    color: #555; font-size: 14px; cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    white-space: nowrap;
  }
  #undo-btn:hover { border-color: #D65076; color: #D65076; }
  .hint { font-size: 10px; color: #333; }
</style>
</head>
<body>

<div class="scroll-area">
  <h1>🎵 LRC タイミングツール</h1>
  <p class="subtitle">Hurry! Hurry! Hurry! — 各行の歌い始めでタップ</p>

  <div id="player">
    <div style="margin-bottom:10px;display:flex;gap:8px;align-items:center;">
      <label style="
        flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
        padding:10px;background:rgba(214,80,118,0.12);border:1.5px dashed rgba(214,80,118,0.4);
        border-radius:8px;cursor:pointer;font-size:13px;color:#D65076;font-weight:700;
      ">
        📂 音楽ファイルを選択
        <input type="file" accept="audio/*" id="file-input" style="display:none" onchange="loadFile(this)">
      </label>
    </div>
    <audio id="audio" controls preload="auto" style="width:100%;margin-bottom:8px;"></audio>
    <div class="timer" id="timer">0:00.00</div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progress-fill"></div>
  </div>

  <div id="lyrics-list"></div>

  <div id="output-area">
    <h2>✅ 完成！LRCをコピーして保存してください</h2>
    <textarea id="lrc-output" readonly></textarea>
    <div class="output-btns">
      <button class="btn-secondary" onclick="copyLrc()">📋 コピー</button>
      <button class="btn-secondary" onclick="downloadLrc()">⬇ ダウンロード</button>
      <button class="btn-secondary" onclick="resetAll()">🔄 やり直し</button>
    </div>
  </div>
</div>

<!-- 固定フッター -->
<div id="fixed-footer">
  <div id="next-line">▶ 再生してからタップ開始</div>
  <div id="status">残り <span id="remaining">48</span> 行 　スペースキーでも可</div>
  <div class="footer-btns">
    <button id="undo-btn" onclick="undo()">↩ 戻す</button>
    <button id="tap-btn" onclick="tap()">⬇ タップ</button>
  </div>
  <div class="hint">⌘Z で1つ戻す</div>
</div>

<script>
const LYRICS = [
  "息を切らして走ってきた君",
  "ポテチの袋を片手に",
  "穴だらけのジーンズでごめん",
  "Psychedelicな夜が始まる",
  "ほったらかしで 夜が明けて",
  "300回目の嘘をついた",
  "中途半端に疑いながら",
  "それでも君は見抜けない",
  "アイスクリームが溶けないうちに",
  "Hurry! Hurry! Hurry! はじまるよ",
  "君と二人で Netflix",
  "ラムレーズン食べながら",
  "夜明けの静かな街はまるで",
  "モノクロ映画のようだね",
  "ねぇ 君は僕のことが好き？",
  "私はグミよりもアイスが好き！",
  "何も起こらない つまらない",
  "台風でも来ないかな？",
  "安いプレゼントでごめんね",
  "今はこれで精一杯",
  "アイスクリームが溶けないうちに",
  "Hurry! Hurry! Hurry! はじまるよ",
  "君と二人で Netflix",
  "ラムレーズン食べながら",
  "過酷で退屈な毎日",
  "そんな日々が続く",
  "喧嘩をしたり笑ったり",
  "最上級の暇つぶし",
  "アイスクリームが溶けないうちに",
  "Hurry! Hurry! Hurry! はじまるよ",
  "君と二人で Netflix",
  "ラムレーズン食べながら",
  "昨日寝てないみたいだね",
  "発売したばかりのゲーム",
  "ずっと 朝までやってたの？",
  "君らしいけど ほどほどにね",
  "何も起こらない つまらない",
  "宇宙人でも来ないかな？",
  "冗談ばかりでごめんね",
  "まだ大人じゃないの",
  "アイスクリームが溶けないうちに",
  "Hurry! Hurry! Hurry! はじまるよ",
  "君と二人で U-NEXT",
  "チョコミント食べながら",
  "アイスクリームが溶けないうちに",
  "Hurry! Hurry! Hurry! はじめよう",
  "君と二人で Netflix",
  "Baskin-Robbinsを 食べながら...",
];

function loadFile(input) {
  if (!input.files[0]) return;
  const url = URL.createObjectURL(input.files[0]);
  audio.src = url;
  audio.load();
  nextLineEl.textContent = '▶ 再生してからタップ開始';
}

const audio = document.getElementById('audio');
const timerEl = document.getElementById('timer');
const nextLineEl = document.getElementById('next-line');
const statusEl = document.getElementById('status');
const tapBtn = document.getElementById('tap-btn');
const remainingEl = document.getElementById('remaining');
const progressFill = document.getElementById('progress-fill');
const listEl = document.getElementById('lyrics-list');
const outputArea = document.getElementById('output-area');

let timings = [], currentIdx = 0, rafId = null;

function fmtTime(sec) {
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60), cs = Math.floor((sec % 1) * 100);
  return `${m}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
}
function fmtLrc(sec) {
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60), cs = Math.floor((sec % 1) * 100);
  return `[${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}]`;
}

function updateNextLine() {
  if (currentIdx < LYRICS.length) {
    nextLineEl.textContent = `▶ 次: ${LYRICS[currentIdx]}`;
  } else {
    nextLineEl.textContent = '✅ 全行完了！';
  }
}

function updateTimer() { timerEl.textContent = fmtTime(audio.currentTime); rafId = requestAnimationFrame(updateTimer); }
audio.addEventListener('play', () => {
  rafId = rafId || requestAnimationFrame(updateTimer);
  tapBtn.disabled = false;
  updateNextLine();
});
audio.addEventListener('pause', () => { cancelAnimationFrame(rafId); rafId = null; });

function buildList() {
  listEl.innerHTML = '';
  LYRICS.forEach((text, i) => {
    const row = document.createElement('div');
    row.className = 'lyric-row' + (i === currentIdx ? ' active' : '') + (i < currentIdx ? ' done' : '');
    row.id = `row-${i}`;
    const timeEl = document.createElement('span');
    timeEl.className = 'lyric-time'; timeEl.id = `time-${i}`;
    timeEl.textContent = timings[i] != null ? fmtLrc(timings[i]).slice(1,-1) : '--:--.--';
    const textEl = document.createElement('span');
    textEl.className = 'lyric-text'; textEl.textContent = text;
    row.appendChild(timeEl); row.appendChild(textEl); listEl.appendChild(row);
  });
  updateNextLine();
}
buildList();

function tap() {
  if (currentIdx >= LYRICS.length || audio.paused) return;
  const t = audio.currentTime;
  timings[currentIdx] = t;
  const row = document.getElementById(`row-${currentIdx}`);
  if (row) { row.classList.remove('active'); row.classList.add('done'); }
  document.getElementById(`time-${currentIdx}`).textContent = fmtLrc(t).slice(1,-1);
  currentIdx++;
  progressFill.style.width = `${(currentIdx / LYRICS.length) * 100}%`;
  remainingEl.textContent = LYRICS.length - currentIdx;
  if (currentIdx < LYRICS.length) {
    const next = document.getElementById(`row-${currentIdx}`);
    if (next) { next.classList.add('active'); next.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    updateNextLine();
  } else {
    finish();
  }
}

function undo() {
  if (currentIdx === 0) return;
  currentIdx--;
  timings[currentIdx] = undefined;
  const row = document.getElementById(`row-${currentIdx}`);
  if (row) { row.classList.remove('done'); row.classList.add('active'); row.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  document.getElementById(`time-${currentIdx}`).textContent = '--:--.--';
  if (currentIdx + 1 < LYRICS.length) {
    const next = document.getElementById(`row-${currentIdx+1}`);
    if (next) next.classList.remove('active');
  }
  progressFill.style.width = `${(currentIdx / LYRICS.length) * 100}%`;
  remainingEl.textContent = LYRICS.length - currentIdx;
  updateNextLine();
  outputArea.style.display = 'none';
  tapBtn.disabled = false;
}

function finish() {
  tapBtn.disabled = true;
  nextLineEl.textContent = '✅ 全行完了！';
  audio.pause();
  document.getElementById('lrc-output').value = LYRICS.map((t, i) => `${fmtLrc(timings[i] ?? 0)}${t}`).join('\n');
  outputArea.style.display = 'block';
  outputArea.scrollIntoView({ behavior: 'smooth' });
}

function copyLrc() {
  const ta = document.getElementById('lrc-output'); ta.select(); document.execCommand('copy');
  nextLineEl.textContent = '📋 コピーしました！';
}
function downloadLrc() {
  const blob = new Blob([document.getElementById('lrc-output').value], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'Hurry! Hurry! Hurry!.lrc'; a.click();
}
function resetAll() {
  timings = []; currentIdx = 0; tapBtn.disabled = false;
  outputArea.style.display = 'none'; progressFill.style.width = '0%';
  remainingEl.textContent = LYRICS.length;
  buildList(); audio.currentTime = 0;
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target !== audio) { e.preventDefault(); if (!audio.paused) tap(); }
  if (e.code === 'KeyZ' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); undo(); }
});
</script>
</body>
</html>
